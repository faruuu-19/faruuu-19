name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"  # runs every 12 hours
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23FF69B4&color_dots=%232a2a3a,%23ffd1e8,%23ff9ecf,%23ff5eb3,%23ff1493&color_empty=%231a1a2e
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23FF69B4&color_dots=%232a2a3a,%23ffd1e8,%23ff9ecf,%23ff5eb3,%23ff1493&color_empty=%230d1117

      - name: Push snake svg to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
